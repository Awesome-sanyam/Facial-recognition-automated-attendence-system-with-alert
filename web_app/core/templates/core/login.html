<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Portal Login</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex align-items-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-5 text-center">
                        <h3 class="mb-4 text-primary">Student Portal</h3>
                        {% if error %}
                        <div class="alert alert-danger">{{ error }}</div>
                        {% endif %}
                        <form method="POST">
                            {% csrf_token %}
                            <div class="mb-3 text-start">
                                <label class="form-label text-muted">Enrollment Number</label>
                                <input type="text" name="enrollment_number" class="form-control"
                                    placeholder="e.g., ENR123456" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Access Dashboard</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
