<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply for Leave — Attendance System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        {% include "core/_theme_css.html" %}
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text-primary);min-height:100vh;transition:background .3s,color .3s;}
        nav{display:flex;align-items:center;justify-content:space-between;padding:0 2rem;height:60px;background:var(--nav-bg);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
        .nav-brand{font-size:.95rem;font-weight:700;} .nav-brand span{color:var(--text-muted);font-weight:400;}
        .nav-right{display:flex;align-items:center;gap:.75rem;}
        .btn-sm{background:var(--bg-input);border:1px solid var(--border);color:var(--text-secondary);border-radius:8px;padding:.4rem .85rem;font-size:.78rem;font-weight:600;font-family:'Inter',sans-serif;text-decoration:none;cursor:pointer;transition:all .2s;}
        .btn-sm:hover{border-color:var(--border-focus);color:var(--text-primary);}
        main{max-width:600px;margin:3rem auto;padding:0 1.5rem;}
        .form-card{background:var(--bg-card);border:1px solid var(--border);border-radius:20px;padding:2.5rem;box-shadow:var(--shadow);}
        .form-card h2{font-size:1.5rem;font-weight:800;margin-bottom:.4rem;}
        .form-card p{color:var(--text-secondary);font-size:.88rem;margin-bottom:2rem;line-height:1.6;}
        .form-group{margin-bottom:1.5rem;}
        label{display:block;font-size:.72rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:.5rem;}
        input[type=date],textarea{width:100%;background:var(--bg-input);border:1px solid var(--border);border-radius:10px;padding:.85rem 1rem;font-size:.9rem;font-family:'Inter',sans-serif;color:var(--text-primary);outline:none;transition:border-color .2s,background .2s;}
        input[type=date]::-webkit-calendar-picker-indicator{filter:invert(0.5);}
        input:focus,textarea:focus{border-color:var(--border-focus);background:var(--bg-input-focus);}
        textarea{resize:vertical;min-height:120px;}
        .btn-row{display:flex;gap:1rem;margin-top:.5rem;}
        .btn-primary{flex:1;background:var(--btn-primary-bg);color:var(--btn-primary-text);border:none;border-radius:10px;padding:.9rem;font-size:.92rem;font-weight:700;font-family:'Inter',sans-serif;cursor:pointer;transition:opacity .2s,transform .2s;}
        .btn-primary:hover{opacity:.88;transform:translateY(-1px);}
        .btn-cancel{flex:0 0 auto;background:transparent;border:1px solid var(--border);color:var(--text-secondary);border-radius:10px;padding:.9rem 1.5rem;font-size:.92rem;font-weight:600;font-family:'Inter',sans-serif;text-decoration:none;display:flex;align-items:center;transition:all .2s;}
        .btn-cancel:hover{border-color:var(--border-focus);color:var(--text-primary);}
    </style>
    <script>(function(){const t=localStorage.getItem('theme')||'dark';document.documentElement.setAttribute('data-theme',t);})();</script>
</head>
<body>
    <nav>
        <div class="nav-brand">Attendance System <span>/ Leave Application</span></div>
        <div class="nav-right">
            <button class="btn-sm" onclick="toggleTheme()" id="themeBtn">☀ Light</button>
            <a href="{% url 'dashboard' student.enrollment_number %}" class="btn-sm">← Dashboard</a>
        </div>
    </nav>
    <main>
        <form method="POST" class="form-card">
            {% csrf_token %}
            <h2>Submit Leave Application</h2>
            <p>Your application will be reviewed by the faculty. Please provide accurate and complete details.</p>
            <div class="form-group">
                <label for="date_requested">Date of Leave</label>
                <input type="date" id="date_requested" name="date_requested" required>
            </div>
            <div class="form-group">
                <label for="reason">Reason for Leave</label>
                <textarea id="reason" name="reason" placeholder="Provide detailed reasoning for your leave request..." required></textarea>
            </div>
            <div class="btn-row">
                <a href="{% url 'dashboard' student.enrollment_number %}" class="btn-cancel">Cancel</a>
                <button type="submit" class="btn-primary">Submit Application →</button>
            </div>
        </form>
    </main>
    <script>
        function toggleTheme(){const h=document.documentElement,t=h.getAttribute('data-theme')==='dark'?'light':'dark';h.setAttribute('data-theme',t);localStorage.setItem('theme',t);document.getElementById('themeBtn').textContent=t==='dark'?'☀ Light':'🌙 Dark';}
        window.addEventListener('DOMContentLoaded',function(){const t=localStorage.getItem('theme')||'dark';document.getElementById('themeBtn').textContent=t==='dark'?'☀ Light':'🌙 Dark';});
    </script>
</body>
</html>
