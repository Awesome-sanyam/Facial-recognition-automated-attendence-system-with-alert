<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply for Leave</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">University Attendance System</span>
            <a href="{% url 'dashboard' student.enrollment_number %}" class="btn btn-outline-light btn-sm">Back to
                Dashboard</a>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h4 class="mb-4">Submit Leave Application</h4>
                        <form method="POST">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label fw-bold">Date of Leave</label>
                                <input type="date" name="date_requested" class="form-control" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-bold">Reason for Leave</label>
                                <textarea name="reason" class="form-control" rows="4"
                                    placeholder="Please provide detailed reasoning..." required></textarea>
                            </div>
                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <a href="{% url 'dashboard' student.enrollment_number %}"
                                    class="btn btn-light me-md-2">Cancel</a>
                                <button type="submit" class="btn btn-primary">Submit Application</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
