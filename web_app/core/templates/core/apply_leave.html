<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply for Leave — Attendance System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #0a0a0a; color: #fff; min-height: 100vh; }
        nav {
            display: flex; align-items: center; justify-content: space-between;
            padding: 1rem 2rem;
            background: rgba(10,10,10,0.8); backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.07);
        }
        .nav-brand { font-size: 0.95rem; font-weight: 700; }
        .nav-brand span { color: #666; font-weight: 400; }
        .btn-nav {
            background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12);
            color: #fff; border-radius: 8px; padding: 0.45rem 1rem;
            font-size: 0.82rem; font-weight: 600; font-family: 'Inter', sans-serif;
            text-decoration: none; cursor: pointer; transition: all 0.2s;
        }
        .btn-nav:hover { background: rgba(255,255,255,0.14); color: #fff; }
        main { max-width: 600px; margin: 3rem auto; padding: 0 1.5rem; }
        .back-link {
            display: inline-flex; align-items: center; gap: 6px;
            color: #666; font-size: 0.82rem; text-decoration: none;
            margin-bottom: 2rem; transition: color 0.2s;
        }
        .back-link:hover { color: #fff; }
        .form-card {
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.09);
            border-radius: 20px; padding: 2.5rem;
        }
        .form-card h2 { font-size: 1.5rem; font-weight: 800; margin-bottom: 0.4rem; }
        .form-card p { color: #888; font-size: 0.88rem; margin-bottom: 2rem; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; font-size: 0.75rem; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 0.5rem; }
        input[type="date"], textarea {
            width: 100%;
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.11);
            border-radius: 10px; padding: 0.85rem 1rem; font-size: 0.9rem;
            font-family: 'Inter', sans-serif; color: #fff; outline: none;
            transition: border-color 0.2s, background 0.2s;
        }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.5; }
        input[type="date"]:focus, textarea:focus { border-color: rgba(255,255,255,0.35); background: rgba(255,255,255,0.09); }
        textarea { resize: vertical; min-height: 120px; }
        .btn-row { display: flex; gap: 1rem; margin-top: 0.5rem; }
        .btn-primary {
            flex: 1; background: #fff; color: #000; border: none; border-radius: 10px;
            padding: 0.9rem; font-size: 0.92rem; font-weight: 700;
            font-family: 'Inter', sans-serif; cursor: pointer; transition: opacity 0.2s, transform 0.2s;
        }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-cancel {
            flex: 0 0 auto; background: transparent;
            border: 1px solid rgba(255,255,255,0.12); color: #888; border-radius: 10px;
            padding: 0.9rem 1.5rem; font-size: 0.92rem; font-weight: 600;
            font-family: 'Inter', sans-serif; text-decoration: none;
            display: flex; align-items: center; transition: all 0.2s;
        }
        .btn-cancel:hover { border-color: rgba(255,255,255,0.3); color: #fff; }
    </style>
</head>
<body>
    <nav>
        <div class="nav-brand">Attendance System <span>/ Leave Application</span></div>
        <a href="{% url 'dashboard' student.enrollment_number %}" class="btn-nav">← Dashboard</a>
    </nav>
    <main>
        <form method="POST" class="form-card">
            {% csrf_token %}
            <h2>Submit Leave Application</h2>
            <p>Your application will be reviewed by the faculty. Please provide accurate details.</p>
            <div class="form-group">
                <label for="date_requested">Date of Leave</label>
                <input type="date" id="date_requested" name="date_requested" required>
            </div>
            <div class="form-group">
                <label for="reason">Reason for Leave</label>
                <textarea id="reason" name="reason" placeholder="Describe your reason in detail..." required></textarea>
            </div>
            <div class="btn-row">
                <a href="{% url 'dashboard' student.enrollment_number %}" class="btn-cancel">Cancel</a>
                <button type="submit" class="btn-primary">Submit Application →</button>
            </div>
        </form>
    </main>
</body>
</html>
