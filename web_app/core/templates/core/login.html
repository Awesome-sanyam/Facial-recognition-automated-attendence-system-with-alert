<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login — Attendance System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        {% include "core/_theme_css.html" %}
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text-primary);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;transition:background .3s,color .3s;}
        .theme-toggle{position:fixed;top:1.25rem;right:1.5rem;z-index:200;background:var(--bg-card);border:1px solid var(--border);color:var(--text-secondary);border-radius:8px;padding:.45rem .9rem;font-size:.8rem;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;transition:all .2s;}
        .theme-toggle:hover{border-color:var(--border-focus);color:var(--text-primary);}
        .card{background:var(--bg-card);border:1px solid var(--border);border-radius:24px;padding:3rem 2.5rem;width:100%;max-width:440px;box-shadow:var(--shadow);}
        .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--text-muted);font-size:.8rem;text-decoration:none;margin-bottom:2.5rem;transition:color .2s;}
        .back-link:hover{color:var(--text-primary);}
        .icon-wrap{width:56px;height:56px;background:var(--bg-input);border:1px solid var(--border);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;margin-bottom:1.5rem;}
        h2{font-size:1.7rem;font-weight:800;margin-bottom:.5rem;}
        .subtitle{color:var(--text-secondary);font-size:.88rem;margin-bottom:2rem;line-height:1.5;}
        .error-box{background:var(--badge-danger-bg);border:1px solid var(--badge-danger-text);border-radius:10px;padding:.8rem 1rem;font-size:.83rem;color:var(--badge-danger-text);margin-bottom:1.5rem;}
        .form-group{margin-bottom:1.25rem;}
        label{display:block;font-size:.72rem;font-weight:700;color:var(--text-muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:.45rem;}
        input[type=text]{width:100%;background:var(--bg-input);border:1px solid var(--border);border-radius:10px;padding:.85rem 1rem;font-size:.92rem;font-family:'Inter',sans-serif;color:var(--text-primary);outline:none;transition:border-color .2s,background .2s;}
        input:focus{border-color:var(--border-focus);background:var(--bg-input-focus);}
        input::placeholder{color:var(--text-placeholder);}
        .btn-primary{width:100%;background:var(--btn-primary-bg);color:var(--btn-primary-text);border:none;border-radius:10px;padding:.9rem;font-size:.95rem;font-weight:700;font-family:'Inter',sans-serif;cursor:pointer;margin-top:.5rem;transition:opacity .2s,transform .2s;}
        .btn-primary:hover{opacity:.88;transform:translateY(-1px);}
        .divider{border:none;border-top:1px solid var(--border);margin:1.75rem 0;}
        .alt-text{font-size:.82rem;color:var(--text-muted);text-align:center;}
        .alt-text a{color:var(--text-secondary);text-decoration:none;font-weight:600;}
        .alt-text a:hover{color:var(--text-primary);}
    </style>
    <script>(function(){const t=localStorage.getItem('theme')||'dark';document.documentElement.setAttribute('data-theme',t);})();</script>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">☀ Light</button>
    <div class="card">
        <a href="{% url 'home' %}" class="back-link">← Back to Portal</a>
        <div class="icon-wrap">🎓</div>
        <h2>Student Login</h2>
        <p class="subtitle">Enter your enrollment number to access your attendance dashboard and leave portal.</p>
        {% if error %}<div class="error-box">{{ error }}</div>{% endif %}
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label for="enrollment">Enrollment Number</label>
                <input type="text" id="enrollment" name="enrollment_number" placeholder="e.g. ENR2024001" autocomplete="off" required>
            </div>
            <button type="submit" class="btn-primary">Access Dashboard →</button>
        </form>
        <hr class="divider">
        <p class="alt-text">Faculty member? <a href="{% url 'faculty_login' %}">Faculty Portal</a></p>
    </div>
    <script>
        function toggleTheme(){const h=document.documentElement,t=h.getAttribute('data-theme')==='dark'?'light':'dark';h.setAttribute('data-theme',t);localStorage.setItem('theme',t);document.getElementById('themeBtn').textContent=t==='dark'?'☀ Light':'🌙 Dark';}
        window.addEventListener('DOMContentLoaded',function(){const t=localStorage.getItem('theme')||'dark';document.getElementById('themeBtn').textContent=t==='dark'?'☀ Light':'🌙 Dark';});
    </script>
</body>
</html>
